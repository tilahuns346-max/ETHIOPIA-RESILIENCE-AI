<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ethGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" /><stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="ethYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" /><stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="ethRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" /><stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Radar Rings / Early Warning Wave -->
  <circle cx="125" cy="120" r="95" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,5" opacity="0.4"/>
  <circle cx="125" cy="120" r="70" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="125" cy="120" r="45" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- Shield Shape -->
  <path d="M125 40 L180 65 V120 C180 158 125 195 125 195 C125 195 70 158 70 120 V65 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Ethiopian Flag Ribbon Accent on Shield -->
  <path d="M90 88 L160 88" stroke="url(#ethGreen)" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 103 L160 103" stroke="url(#ethYellow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 118 L160 118" stroke="url(#ethRed)" stroke-width="5" stroke-linecap="round"/>

  <!-- AI Neural / Radar Pulse Nodes -->
  <circle cx="125" cy="142" r="6" fill="#38bdf8"/>
  <line x1="125" y1="142" x2="105" y2="162" stroke="#38bdf8" stroke-width="2"/>
  <line x1="125" y1="142" x2="145" y2="162" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="105" cy="162" r="4.5" fill="#fde047"/>
  <circle cx="145" cy="162" r="4.5" fill="#22c55e"/>

  <!-- Typography -->
  <text x="220" y="82" font-family="'Segoe UI', Inter, Roboto, sans-serif" font-weight="900" font-size="38" fill="#f8fafc" letter-spacing="1.5">ETHIOPIA RESILIENCE AI</text>
  <text x="222" y="118" font-family="'Segoe UI', Inter, Roboto, sans-serif" font-weight="700" font-size="19" fill="#38bdf8">የኢትዮጵያ አደጋ ቅድመ ማስጠንቀቂያና ምላሽ መድረክ</text>
  <text x="222" y="152" font-family="'Segoe UI', Inter, Roboto, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">National Disaster Early Warning, Community Reporting &amp; Incident Coordination</text>

  <!-- Status Badges -->
  <rect x="222" y="174" width="140" height="28" rx="6" fill="#0369a1" fill-opacity="0.35" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="236" cy="188" r="4.5" fill="#22c55e"/>
  <text x="248" y="193" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#bae6fd" letter-spacing="0.5">EDRMC ALIGNED</text>

  <rect x="375" y="174" width="185" height="28" rx="6" fill="#854d0e" fill-opacity="0.35" stroke="#ca8a04" stroke-width="1.2"/>
  <circle cx="390" cy="188" r="4.5" fill="#fde047"/>
  <text x="402" y="193" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#fef08a" letter-spacing="0.5">HUMAN-IN-THE-LOOP AI</text>

  <rect x="572" y="174" width="145" height="28" rx="6" fill="#15803d" fill-opacity="0.35" stroke="#22c55e" stroke-width="1.2"/>
  <circle cx="587" cy="188" r="4.5" fill="#38bdf8"/>
  <text x="599" y="193" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#bbf7d0" letter-spacing="0.5">OFFLINE RESILIENT</text>
</svg>
